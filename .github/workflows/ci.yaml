name: DevSecOps AI Engineering CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Schema & Guardrail Tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify Knowledge Base Indexing
        run: |
          python -c "from src.rag.store import KnowledgeStore; store = KnowledgeStore(); print('[OK] Knowledge indexed:', store.count())"
